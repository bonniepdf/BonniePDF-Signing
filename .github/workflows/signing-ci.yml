name: Signing CI (.NET)

# Builds and tests the BonniePDF.Signing add-on. This is the gate that
# compiles the .NET port (which has no SDK in some authoring environments)
# and runs its xUnit suite before any release.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'dotnet/**'
      - '.github/workflows/signing-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'dotnet/**'
      - '.github/workflows/signing-ci.yml'

permissions:
  contents: read

concurrency:
  group: signing-ci-dotnet-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'automatic' }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: BonniePDF-Signing/dotnet

jobs:
  build:
    name: Build & test BonniePDF.Signing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BonniePDF-Signing
      - uses: actions/checkout@v4
        with:
          repository: bonniepdf/BonniePDF-NET
          ref: b668c634a1d365467b6c1b6f3c56b800ac210bf4 # v2026.11.21
          path: BonniePDF-NET

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore BonniePDF.Signing.Tests/BonniePDF.Signing.Tests.csproj

      - name: Build
        run: dotnet build BonniePDF.Signing.Tests/BonniePDF.Signing.Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test BonniePDF.Signing.Tests/BonniePDF.Signing.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack BonniePDF.Signing/BonniePDF.Signing.csproj --configuration Release --output nupkgs

      # Confirm the produced package actually contains the compiled assembly.
      - name: Verify package contents
        run: |
          set -euo pipefail
          nupkg=$(ls nupkgs/*.nupkg | head -n1)
          echo "Inspecting $nupkg"
          for tfm in net8.0 net10.0; do
            unzip -l "$nupkg" | grep -q "lib/$tfm/BonniePDF.Signing.dll" \
              || { echo "::error::BonniePDF.Signing.dll ($tfm) missing from package"; exit 1; }
          done
          echo "Package contains BonniePDF.Signing.dll for net8.0 and net10.0 ✓"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: bonniepdf-signing-nupkg
          path: BonniePDF-Signing/dotnet/nupkgs/*.nupkg
          retention-days: 14

  validate:
    name: External validation (pdfsig)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: BonniePDF-Signing
      - uses: actions/checkout@v4
        with:
          repository: bonniepdf/BonniePDF-NET
          ref: b668c634a1d365467b6c1b6f3c56b800ac210bf4 # v2026.11.21
          path: BonniePDF-NET

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Install poppler-utils (pdfsig)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Generate signed sample PDFs
        run: dotnet run --project BonniePDF.Signing.SampleGen --configuration Release -- signed-samples

      - name: Validate signatures with pdfsig
        run: bash scripts/pdfsig-validate.sh signed-samples

  conformance:
    name: PAdES conformance (EU DSS)
    runs-on: ubuntu-latest
    # `pdfsig` proves a signature verifies. It says nothing about which PAdES
    # baseline level the signature reaches - and the level is the claim the
    # product sells. This job checks the claim against the European Commission's
    # own validator, offline, with only the samples' throwaway CA trusted.
    steps:
      - uses: actions/checkout@v4
        with:
          path: BonniePDF-Signing
      - uses: actions/checkout@v4
        with:
          repository: bonniepdf/BonniePDF-NET
          ref: b668c634a1d365467b6c1b6f3c56b800ac210bf4 # v2026.11.21
          path: BonniePDF-NET

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache the DSS validator
        uses: actions/cache@v4
        with:
          path: BonniePDF-Signing/dotnet/tools/dss/lib
          key: dss-gate-${{ hashFiles('BonniePDF-Signing/dotnet/tools/dss/pom.xml') }}

      - name: Generate signed sample PDFs
        run: dotnet run --project BonniePDF.Signing.SampleGen --configuration Release -- signed-samples

      - name: Check every signature reaches the level it claims
        run: bash tools/dss/validate.sh signed-samples
