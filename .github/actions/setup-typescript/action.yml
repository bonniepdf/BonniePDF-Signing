name: Set up Signing TypeScript
description: Install the pinned core source and Signing test workspace
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        repository: bonniepdf/BonniePDF-TypeScript
        ref: 50229e2f06b6ffe36c6ede2d740309bf86d8149d # v2026.11.21
        path: BonniePDF-TypeScript
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - uses: pnpm/action-setup@v4
      with:
        version: 11.0.9
        run_install: false
    - name: Prepare the test workspace
      shell: bash
      env:
        CI_FILES: ${{ github.action_path }}/../../ci
      run: |
        cp "$CI_FILES/package.json.template" package.json
        cp "$CI_FILES/pnpm-workspace.yaml.template" pnpm-workspace.yaml
        cp "$CI_FILES/pnpm-lock.yaml.template" pnpm-lock.yaml
        pnpm install --frozen-lockfile
        pnpm --filter @bonniepdf/core run build
